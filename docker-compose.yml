version: '3.8'

services:
  nginx:
    image: tiangolo/nginx-rtmp
    ports:
      - "1935:1935"
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./hls:/hls
  ffmpeg:
    image: jrottenberg/ffmpeg
    command: -i rtmp://nginx/live/stream -c copy -f hls -hls_time 2 -hls_list_size 10 /hls/stream.m3u8
    volumes:
      - ./hls:/hls
    depends_on:
      - nginx
